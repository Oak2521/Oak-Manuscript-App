name: Hosted source gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-source:
    name: Linux source and contract gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14
      - name: Install locked dependencies
        run: npm ci
      - name: Verify workflow safety contract
        run: npm run verify:hosted-ci
      - name: Verify source build inputs
        run: npm run verify:web:migrations && npm run verify:standards && npm run verify:fuses:config
      - name: Run portable Oak Account source tests
        run: npm run test:hosted

  windows-source:
    name: Windows source and contract gates
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14
      - name: Install locked dependencies
        run: npm ci
      - name: Verify workflow safety contract
        run: npm run verify:hosted-ci
      - name: Verify source build inputs
        run: npm run verify:web:migrations && npm run verify:standards && npm run verify:fuses:config
      - name: Run portable Oak Account source tests
        run: npm run test:hosted
